<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미슬토우 · JINGLE TV</title>
<meta name="description" content="JINGLE TV 오리지널 크리스마스 연애 리얼리티 《미슬토우》 시즌 1 MISTLETOE · 시즌 2 AFTER DARK 프로그램 소개">
<meta property="og:title" content="《미슬토우》 · JINGLE TV ORIGINAL">
<meta property="og:description" content="겨울, 사랑이 내리는 순간. 설산 리조트에서 보내는 크리스마스.">
<meta property="og:image" content="assets/s1-group-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
/* ── SEASON THEMES ───────────────────────────── */
:root,[data-season="s1"]{
  --bg:#f6f1e8;--bg2:#efe7d9;--card:#fffdf8;--ink:#1e2a24;--sub:#6a6f66;--line:#e2d8c6;
  --acc:#b3243a;--acc2:#2f5d46;--gold:#b8913d;--chip:#f1e6d6;--chipt:#7a2232;
  --bar:#1d2b24;--bart:#f6efe2;--hero1:#2f5d46;--hero2:#7a1d2c;--shadow:0 6px 24px rgba(60,40,20,.10);
  --out:#1d2b24;--outt:#f3ede2;--sel:#b3243a;
  color-scheme:light;
}
[data-season="s2"]{
  --bg:#0e0a0c;--bg2:#160f13;--card:#1b1317;--ink:#f3e9e3;--sub:#ad9ea2;--line:#33242b;
  --acc:#c23a55;--acc2:#d4af6a;--gold:#d4af6a;--chip:#2a1b22;--chipt:#f0c9a4;
  --bar:#060405;--bart:#f3e9e3;--hero1:#2a0e18;--hero2:#4a1430;--shadow:0 6px 28px rgba(0,0,0,.45);
  --out:#060405;--outt:#efe3dc;--sel:#d4af6a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.65;transition:background .5s,color .5s;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* ── TOP BAR ─────────────────────────────────── */
.top{position:sticky;top:0;z-index:50;background:var(--bar);color:var(--bart);transition:background .5s;padding-top:env(safe-area-inset-top,0)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:40px;font-size:12px;font-weight:700}
.live{display:flex;align-items:center;gap:7px;letter-spacing:1.5px;color:#ff6b81;font-weight:900}
.live i{width:8px;height:8px;border-radius:50%;background:#ff3355;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.2}}
.logo{font-family:"Playfair Display",serif;font-weight:900;font-size:15px;letter-spacing:.5px;white-space:nowrap}
.logo b{color:var(--sel)}
.clk{font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap}
.status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seasonbar{display:flex;gap:6px;padding:0 0 8px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 8px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--bart);opacity:.62;transition:.25s;min-width:0}
.sbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn em{font-style:normal;font-size:10px;font-weight:900;border-radius:4px;padding:1px 5px;flex:none}
.sbtn[data-s="s1"] em{background:#2f8a4f;color:#fff}
.sbtn[data-s="s2"] em{background:#d0021b;color:#fff}
.sbtn.on{opacity:1;background:rgba(255,255,255,.14);border-color:var(--sel)}
.gnb{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.18)}
.gnb::-webkit-scrollbar{display:none}
.gnb a{flex:none;text-decoration:none;font-size:13px;font-weight:700;padding:9px 12px;opacity:.78}
.gnb a:hover{opacity:1;color:var(--sel)}
.gnb a.tz{color:var(--sel);opacity:1}

/* ── HERO ────────────────────────────────────── */
.hero{position:relative;margin-top:14px;border-radius:22px;overflow:hidden;min-height:520px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;box-shadow:var(--shadow);touch-action:pan-y}
.hero .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;opacity:0;transition:opacity 1.2s ease}
.hero .slide.on{opacity:1}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.25) 50%,rgba(8,4,6,.92));pointer-events:none}
.snow{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
[data-season="s2"] .snow i{background:#f2c46b;width:3px;height:3px;opacity:.7;box-shadow:0 0 6px #f2c46b}
@keyframes fall{to{transform:translate3d(30px,560px,0)}}
.hin{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:24px 22px 22px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:2px;color:#ffd9a8;text-transform:uppercase}
.htitle{margin:6px 0 2px;font-family:"Playfair Display",serif;font-size:clamp(40px,8vw,72px);line-height:1;font-weight:900;letter-spacing:-.5px}
.htitle small{display:block;font-size:.34em;letter-spacing:4px;font-style:italic;color:#ffd9a8;margin-top:8px}
.hko{font-family:"Noto Serif KR",serif;font-weight:900;font-size:20px;margin-top:6px}
.hhook{font-size:15px;opacity:.92;margin:6px 0 12px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.badges span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
.badges .rate{background:#2f8a4f;border:0}
[data-season="s2"] .badges .rate{background:#d0021b}
.cap{display:inline-block;background:rgba(0,0,0,.66);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:700;min-height:36px;transition:opacity .3s}
.harrow{position:absolute;top:30%;z-index:3;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(4px)}
.harrow.l{left:10px}.harrow.r{right:10px}
.hdots{position:absolute;top:14px;right:16px;z-index:3;display:flex;gap:6px}
.hdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.hdots i.on{background:#fff;width:20px;border-radius:5px}
.htag{position:absolute;top:14px;left:16px;z-index:3;font-size:11px;font-weight:900;letter-spacing:1.5px;background:var(--acc);padding:4px 9px;border-radius:6px}

.ticker{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:13px;display:flex;gap:10px;align-items:center;overflow:hidden}
.ticker b{flex:none;background:var(--acc);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub);transition:opacity .3s}

/* ── SECTIONS ────────────────────────────────── */
section{padding-top:8px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:40px 0 4px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sh h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.3px}
.sh h2 small{display:block;font-family:"Playfair Display",serif;font-size:11px;letter-spacing:2.5px;color:var(--acc);font-weight:900;text-transform:uppercase}
.sh .hint{font-size:12px;color:var(--sub);text-align:right}
.lead{font-size:15px;margin:14px 0}
.fade{animation:fd .45s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}

.intro{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.slogan{font-family:"Playfair Display",serif;font-style:italic;font-size:19px;color:var(--acc);margin:0 0 4px;line-height:1.35}
.slogan+p{margin:0 0 12px;color:var(--sub);font-size:13px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--acc);line-height:1.2}
.stat span{font-size:12.5px;color:var(--sub)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--chip);color:var(--chipt);font-size:11.5px;font-weight:700}

.routes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.route{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);overflow:hidden}
.route .no{font-family:"Playfair Display",serif;font-size:11px;letter-spacing:2px;font-weight:900;color:var(--acc)}
.route h3{margin:2px 0 2px;font-family:"Noto Serif KR",serif;font-size:19px}
.route .when{font-size:12.5px;font-weight:700;color:var(--acc2)}
.route p{font-size:13.5px;color:var(--sub);margin:8px 0}
.scene{background:var(--bg2);border-radius:10px;padding:11px 12px;font-size:13px;margin-top:8px}
.scene q{display:block;quotes:none;margin:2px 0}
.scene q b{color:var(--acc)}

/* cast */
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.cc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;text-align:left;padding:0}
.cc:hover{transform:translateY(-4px)}
.cc .im{aspect-ratio:3/4;overflow:hidden;background:var(--bg2);position:relative}
.cc img{width:100%;height:100%;object-fit:cover;object-position:center 18%;transition:transform .6s}
.cc:hover img{transform:scale(1.05)}
.cc .im:after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}
.cc .quote{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;color:#fff;font-size:13px;font-weight:500;line-height:1.45;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.cc .badge{position:absolute;top:10px;left:10px;z-index:2;font-size:10.5px;font-weight:900;letter-spacing:1px;background:var(--acc);color:#fff;padding:3px 8px;border-radius:6px}
.cc .tx{padding:12px 14px 14px}
.nm{font-size:19px;font-weight:900;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.nm small{font-size:12.5px;color:var(--sub);font-weight:500}
.rl{font-size:13px;color:var(--sub);margin:1px 0 8px}
.sw{display:flex;gap:10px;margin-top:9px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.sw span{display:flex;align-items:center;gap:5px}
.sw i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.more{font-size:11.5px;font-weight:700;color:var(--acc);margin-top:8px}

/* stills rail */
.rail{display:flex;gap:12px;overflow-x:auto;padding:16px 2px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.still{flex:0 0 240px;scroll-snap-align:start;background:#1b1a22;border-radius:16px;padding:7px;cursor:pointer;border:0;text-align:left}
.still .im{aspect-ratio:3/4;border-radius:11px;overflow:hidden}
.still img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.still .lb{display:flex;justify-content:space-between;gap:6px;padding:8px 5px 3px;color:#fff;font-size:12px;font-weight:700}
.still .lb i{font-style:normal;color:#ff8a9e;font-size:10px;white-space:nowrap}

/* schedule */
.days{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:16px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;cursor:pointer;text-align:center;transition:.2s}
.day b{display:block;font-size:11px;letter-spacing:1px;color:var(--sub)}
.day span{display:block;font-size:15px;font-weight:900}
.day.on{background:var(--acc);border-color:var(--acc);color:#fff}
.day.on b{color:rgba(255,255,255,.8)}
.dayview{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.dayview h3{margin:0;font-family:"Playfair Display",serif;font-size:26px;line-height:1.15}
.dayview h3 small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px}
.dayview .ko{font-size:14px;color:var(--sub);margin:2px 0 12px}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:6px 0 6px 18px;font-size:14px}
.tl li:before{content:"";position:absolute;left:-7px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl li.hi:before{background:var(--acc)}
.tl time{font-weight:900;font-variant-numeric:tabular-nums;margin-right:8px;color:var(--acc)}
.note{font-size:12px;color:var(--sub);margin:10px 0 0}

/* signature */
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.sg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sg .ic{font-size:24px}
.sg h4{margin:4px 0 2px;font-family:"Playfair Display",serif;font-size:17px;letter-spacing:.3px}
.sg .k{font-size:12px;color:var(--acc);font-weight:700}
.sg p{font-size:13px;color:var(--sub);margin:6px 0 0}

/* privileges / cards */
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:16px}
.ticket{border-radius:16px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:150px;box-shadow:var(--shadow)}
.ticket:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.ticket .gr{font-family:"Playfair Display",serif;font-size:30px;font-weight:900;line-height:1}
.ticket .nmx{font-size:12px;font-weight:900;letter-spacing:1.5px;margin-top:4px;opacity:.9}
.ticket p{font-size:12.5px;margin:10px 0 0;opacity:.92}
.ticket .lim{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 7px}
.rules{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.rule b{font-size:11px;letter-spacing:1px;color:var(--acc)}
.rule h5{margin:2px 0;font-size:15px}
.rule p{margin:0;font-size:12.5px;color:var(--sub)}

/* house */
.house{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:16px}
.floor{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.floor h4{margin:0 0 8px;font-size:13px;letter-spacing:1.5px;color:var(--acc)}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.room{border-radius:12px;padding:12px;color:#fff;font-weight:900;font-family:"Playfair Display",serif;font-size:18px;position:relative;min-height:70px}
.room small{display:block;font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:500;opacity:.85}
.fl{list-style:none;padding:0;margin:0}
.fl li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.fl li:last-child{border:0}
.fl li span:last-child{color:var(--sub);font-size:12px;white-space:nowrap}
.grid-ph{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.ph{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/2;cursor:pointer;border:0;padding:0;background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:hover img{transform:scale(1.06)}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11.5px;font-weight:700;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.75));text-align:left}
.ph.wide{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}

/* crew */
.crew{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-top:16px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;text-align:left;box-shadow:var(--shadow)}
.cr .im{aspect-ratio:1/1;overflow:hidden}
.cr img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.cr .tx{padding:10px 12px 12px}
.cr .ro{font-size:10.5px;font-weight:900;letter-spacing:1px;color:var(--acc)}
.cr .n{font-size:15.5px;font-weight:900}
.cr p{margin:3px 0 0;font-size:12px;color:var(--sub);line-height:1.5}

/* command demo */
.cmd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:16px;box-shadow:var(--shadow)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{border:0;border-radius:20px;padding:6px 12px;background:var(--chip);color:var(--chipt);font-size:12.5px;font-weight:700;cursor:pointer}
.btns button.on{background:var(--acc);color:#fff}
.btns button i{font-style:normal;font-size:10px;opacity:.75;margin-left:4px}
.desc{font-size:12.5px;color:var(--sub);margin:10px 0 0}
.out{margin-top:10px;background:var(--out);color:var(--outt);border-radius:12px;padding:14px;font-size:13px;white-space:pre-wrap;font-family:"Noto Sans KR",ui-monospace,monospace;line-height:1.7;min-height:120px;max-height:380px;overflow:auto}
.out em{display:block;color:#ff8a9e;font-style:normal;font-size:11px;margin-bottom:6px;letter-spacing:1px}

/* live log */
.lg div{display:flex;gap:9px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line);animation:fd .5s}
.lg div:last-child{border:0}
.lg time{flex:none;color:var(--sub);font-variant-numeric:tabular-nums}
.lg b{flex:none;font-size:10.5px;border-radius:6px;padding:0 7px;height:20px;line-height:20px;background:var(--chip);color:var(--chipt)}
.lg b.f{background:var(--acc);color:#fff}

/* guide */
.guide{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.guide ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.guide li{margin:4px 0}
.guide h4{margin:0;font-size:15px}

.ft{text-align:center;font-size:11.5px;color:var(--sub);margin:50px 0 30px;line-height:1.8}
.ft b{font-family:"Playfair Display",serif;font-size:15px;color:var(--ink)}

/* ── MODAL / LIGHTBOX ───────────────────────── */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 12px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{position:relative;width:100%;max-width:880px;background:var(--card);color:var(--ink);border-radius:20px;overflow:hidden;animation:fd .35s}
.mx{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:18px;cursor:pointer}

  $('mbox').innerHTML='<button class="mx" aria-label="닫기">✕</button><div class="mtop"><div class="im">'+img(faceOf(c,key),c.n,false)+'<span class="mtag">'+(key==='s1'?'SEASON 01':'SEASON 02')+' · CAST</span></div><div class="mtx">'+
   '<span class="tg">'+esc(cur.ko)+'</span><div class="nm" style="margin-top:6px">'+esc(c.n)+' <small>'+c.a+'세 · '+c.g+'</small></div><div class="rl" style="font-size:14px">'+esc(c.job)+'</div><div style="font-size:14px;font-style:italic;color:var(--acc);margin:4px 0">'+esc(c.q)+'</div>'+
   '<dl class="prof"><dt>신체</dt><dd>'+c.h+' · 생일 '+c.b+' · '+c.smoke+'</dd><dt>헤어</dt><dd>'+esc(c.hair)+'</dd><dt>눈</dt><dd>'+esc(c.eye)+'</dd><dt>향</dt><dd>'+esc(c.scent)+'</dd><dt>성격</dt><dd>'+esc(c.per)+'</dd><dt>출연 계기</dt><dd>'+esc(c.mot)+'</dd><dt>취미·일상</dt><dd>'+esc(c.life)+'</dd></dl>'+
   '<div style="margin-top:10px">'+c.tags.map(function(t){return '<span class="tg">'+esc(t)+'</span>'}).join(' ')+'</div></div></div>';
  bindModal();
}
function openCrew(i){
  var c=CREW[i];
  $('mbox').className='mbox crewbox';
  $('mbox').innerHTML='<button class="mx" aria-label="닫기">✕</button><div class="mcrew">'+img('crew-'+c.id+'-01.png',c.n,false)+'<span class="mtag">THE JINGLE CREW</span><div class="cap2"><div class="ro">'+esc(c.ro)+'</div><div class="n">'+esc(c.n)+'</div>'+(c.s?'<div class="s">'+esc(c.s)+'</div>':'')+'</div></div>';
  bindModal();
}
function bindModal(list){
  var m=$('modal');m.classList.add('on');document.body.style.overflow='hidden';m.scrollTop=0;
  m.querySelector('.mx').onclick=closeModal;
  [].forEach.call(m.querySelectorAll('.mgrid button'),function(b){b.onclick=function(){openLB(list,+b.getAttribute('data-j'))}});
}
function closeModal(){$('modal').classList.remove('on');document.body.style.overflow=''}
$('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.addEventListener('keydown',function(e){
  if($('lb').classList.contains('on')){if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')$('lbp').click();if(e.key==='ArrowRight')$('lbn').click();return}
  if(e.key==='Escape')closeModal();
});

/* delegated clicks in content */
$('content').addEventListener('click',function(e){
  var t=e.target.closest('[data-cast],[data-crew],[data-gal]');if(!t)return;
  if(t.hasAttribute('data-cast'))openCast(+t.getAttribute('data-cast'));
  else if(t.hasAttribute('data-crew'))openCrew(+t.getAttribute('data-crew'));
  else if(t.hasAttribute('data-gal')){var g=t.getAttribute('data-gal'),l=g==='house'?cur.housePh.map(function(p){return[cur.housePre+(p[0]<10?'0':'')+p[0]+'.png',p[1]]}):RESORT.map(function(p){return['place-resort-'+(p[0]<10?'0':'')+p[0]+'.png',p[1]]});openLB(l,+t.getAttribute('data-i'))}
});
/* nav anchors: scroll without touching the season hash */
[].forEach.call(document.querySelectorAll('.gnb a[href^="#"]'),function(a){a.addEventListener('click',function(e){e.preventDefault();var el=$(a.getAttribute('href').slice(1));if(el)el.scrollIntoView({behavior:'smooth'})})});

/* ── SEASON SWITCH ───────────────────────── */
/* season intro splash: S1 on first visit, S2 (with age check) on every entry */
var SPLASH={
 s1:{bg:'s1-group-2.png',html:'<div class="ilogo">JINGLE<b>·</b>TV<span>PRESENTS</span></div><div class="iribbon">CHRISTMAS DATING REALITY</div><h1 class="ititle">MISTLETOE</h1><div class="isub">SEASON 01 · 《미슬토우》</div><p class="ihook">겨울, 사랑이 내리는 순간.</p><div class="imeta"><em>ALL</em>전체 이용가 · 11.24 FIRST SNOW</div><button class="ienter" id="spOk">❄ 입장하기</button><button class="iswap" id="spSwap">시즌 2 · AFTER DARK로 가기 ›</button>'},
 s2:{bg:'s2-group-1.png',html:'<div class="ilogo">JINGLE<b>·</b>TV<span>LATE NIGHT</span></div><div class="g19">19</div><h1 class="ititle">AFTER DARK</h1><div class="isub">MISTLETOE · SEASON 02</div><p class="ihook">겨울, 마음이 가장 뜨거워지는 밤.</p><p class="iwarn">이 프로그램은 성인 대상입니다.<br>음주·흡연 장면이 포함됩니다.<br><b>만 19세 이상이신가요?</b></p><button class="ienter" id="spOk">19세 이상, 입장하기</button><button class="iswap" id="spSwap">시즌 1로 돌아가기</button>'}
};
function showSplash(key){
  var S=SPLASH[key],sp=$('splash');
  sp.setAttribute('data-k',key);
  $('ibg').style.backgroundImage='url('+A+S.bg+')';
  var fx='',n=key==='s1'?44:30;
  for(var i=0;i<n;i++){var sz=key==='s1'?(2+Math.random()*5):(1.5+Math.random()*2.5);fx+='<i style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(7+Math.random()*9)+'s;animation-delay:-'+(Math.random()*14)+'s;opacity:'+(.4+Math.random()*.6)+'"></i>'}
  $('ifx').innerHTML=fx;
  $('ibox').innerHTML=S.html;
  sp.classList.add('on');document.body.style.overflow='hidden';
  $('spOk').onclick=function(){hideSplash();if(!cur||cur.key!==key)render(key,true)};
  $('spSwap').onclick=key==='s1'?function(){showSplash('s2')}:function(){hideSplash();if(!cur||cur.key!=='s1')render('s1');else{try{history.replaceState(null,'','#s1')}catch(e){}}};
  $('spOk').focus();
}
function hideSplash(){$('splash').classList.remove('on');document.body.style.overflow=''}
function go(key,fromUser){
  if(key==='s2'){showSplash('s2');return}
  render(key,fromUser);
}
[].forEach.call(document.querySelectorAll('.sbtn'),function(b){b.onclick=function(){var k=b.getAttribute('data-s');if(!cur||cur.key!==k)go(k,true)}});
$('prevS').onclick=function(){heroStep(-1)};
$('nextS').onclick=function(){heroStep(1)};
(function(){var h=$('hero'),x0=null,y0=null;
  h.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  h.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)heroStep(dx<0?1:-1);x0=null},{passive:true});
})();
window.addEventListener('hashchange',function(){var k=location.hash.replace('#','');if((k==='s1'||k==='s2')&&cur&&k!==cur.key)go(k,false)});

/* ── CLOCK & AIR STATUS ──────────────────── */
function pad(n){return(n<10?'0':'')+n}
function tick(){
  var d=new Date();$('clk').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  var y=d.getFullYear(),start=new Date(y,10,24),end=new Date(y,11,26),st;
  if(d<start){var dd=Math.ceil((start-d)/864e5);st='첫 방송 D-'+dd}
  else if(d<end){var ep=Math.floor((d-start)/864e5)+1;st='EP.'+pad(ep)+' 방송 중'}
  else st='전 회차 다시보기';
  $('airStatus').textContent=st;
}
tick();setInterval(tick,1000);

var init=location.hash.replace('#','');
render('s1');showSplash(init==='s2'?'s2':'s1');
})();
</script>
