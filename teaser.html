<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미슬토우 티저 · JINGLE TV</title>
<meta name="description" content="JINGLE TV 오리지널 《미슬토우》 시즌 1 MISTLETOE · 시즌 2 AFTER DARK 스페셜 티저">
<meta property="og:title" content="《미슬토우》 SPECIAL TEASER · JINGLE TV">
<meta property="og:description" content="올겨울, 설산의 리조트에서. 11.24 — 12.25">
<meta property="og:image" content="assets/s1-group-1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@600;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{--red:#b3243a;--pine:#2f5d46;--cream:#f4ecdf;--wine:#7a1430;--gold:#d4af6a;--ink:#1a0f12}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0;overflow:hidden;background:#000}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;animation:fin .5s both}
@keyframes fin{from{opacity:0}}
.bg{position:absolute;inset:-6%;background-size:cover;background-position:center 25%;animation:kb 5s ease-out both}
@keyframes kb{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
.bg.blur{filter:blur(18px) brightness(.55);inset:-10%;animation:none}
.shade{position:absolute;inset:0}
/* cinematic bars + bug */
.bars:before,.bars:after{content:"";position:fixed;left:0;right:0;height:6vh;background:#000;z-index:20}
.bars:before{top:0}.bars:after{bottom:0}
.bug{position:fixed;top:calc(6vh + 12px);left:16px;z-index:21;font-weight:900;letter-spacing:3px;font-size:12px;opacity:.85;display:flex;align-items:center;gap:8px}
.bug i{width:8px;height:8px;border-radius:50%;background:#ff2d48;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.bug small{font-size:10px;letter-spacing:2px;opacity:.7}
.rate{position:fixed;top:calc(6vh + 10px);right:16px;z-index:21;font-weight:900;font-size:12px;border-radius:6px;padding:3px 8px;display:none}
.rate.all{display:block;background:var(--pine)}
.rate.r19{display:block;background:#d0021b;border-radius:50%;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
.prog{position:fixed;left:0;bottom:6vh;height:3px;background:var(--red);z-index:22;width:0;transition:width .25s linear}
.skip{position:fixed;right:14px;bottom:calc(6vh + 14px);z-index:23;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(4px)}
/* particles */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx i{position:absolute;top:-10px;border-radius:50%;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(40px,110vh,0)}}
.fx.snow i{background:#fff;box-shadow:0 0 5px rgba(200,220,240,.7)}
.fx.gold i{background:#f2c46b;box-shadow:0 0 8px #f2c46b}
/* type */
.logo{font-weight:900;letter-spacing:6px;font-size:clamp(28px,7vw,54px);animation:pop 1.2s cubic-bezier(.2,.8,.2,1) both}
.logo b{color:var(--red)}
@keyframes pop{from{opacity:0;letter-spacing:22px;filter:blur(8px)}}
.kicker{font-size:12px;letter-spacing:6px;opacity:.75;margin-top:14px;animation:up .8s .6s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.line{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(22px,5.4vw,44px);line-height:1.45;padding:0 22px;text-shadow:0 2px 18px rgba(0,0,0,.55)}
.line .c{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:4px;vertical-align:-3px;animation:bl .8s infinite}
.cap{position:absolute;left:0;right:0;bottom:calc(6vh + 54px);z-index:6;padding:0 20px;animation:up .7s .3s both}
.cap span{display:inline-block;background:rgba(0,0,0,.62);padding:8px 14px;border-radius:6px;font-weight:700;font-size:clamp(14px,3.4vw,20px)}
/* cast cut */
.cut{position:relative;z-index:6;display:flex;flex-direction:column;align-items:center}
.card{width:min(62vw,calc(50vh * 0.684),330px);aspect-ratio:832/1216;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:zin .9s cubic-bezier(.2,.8,.2,1) both}
.card img{width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block}
@keyframes zin{from{transform:scale(1.18);opacity:0}}
.l3{margin-top:14px;text-align:left;display:flex;align-items:stretch;gap:0;animation:slide .6s .15s both}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}}
.l3 .bar{width:5px;border-radius:3px}
.l3 .t{padding:4px 12px}
.l3 .n{font-size:clamp(20px,4.6vw,28px);font-weight:900;line-height:1.2}
.l3 .n small{font-size:.55em;font-weight:700;opacity:.8;margin-left:6px}
.l3 .j{font-size:13px;opacity:.85}
.flash{position:absolute;inset:0;background:#fff;z-index:9;animation:fl .35s both;pointer-events:none}
@keyframes fl{from{opacity:.85}to{opacity:0}}
/* title cards */
.tt{position:relative;z-index:6;padding:0 18px}
.tt .t1{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(46px,13vw,112px);line-height:.95;animation:pop 1.3s cubic-bezier(.2,.8,.2,1) both}
.tt .t2{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(15px,3.4vw,24px);letter-spacing:3px;margin-top:10px;animation:up .8s .5s both}
.tt .t3{font-family:'Noto Serif KR',serif;font-weight:600;font-size:clamp(15px,3.6vw,22px);margin-top:14px;animation:up .8s .8s both}
.tt .b{display:inline-flex;gap:8px;margin-top:16px;animation:up .8s 1.1s both}
.tt .b span{border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:900}
.s1 .t1{color:var(--red)}.s1 .t2{color:var(--pine)}.s1 .t3{color:#4a2626}
.s1 .b span{background:#fff;color:var(--red);border:1px solid #e3c9c9}.s1 .b span:first-child{background:var(--pine);color:#fff;border:0}
.s2 .t1{background:linear-gradient(180deg,#f6e2b3,#c9963f);-webkit-background-clip:text;background-clip:text;color:transparent}
.s2 .t2{color:var(--gold)}.s2 .t3{color:#f0dcd2}
.s2 .b span{background:rgba(255,255,255,.08);color:#f0c9a4;border:1px solid #5a2a38}.s2 .b span:first-child{background:#d0021b;color:#fff;border:0}
/* end card */
.end{position:relative;z-index:6;width:min(560px,92vw);padding:26px 22px;border-radius:20px;background:rgba(12,6,9,.72);border:1px solid rgba(212,175,106,.35);backdrop-filter:blur(8px);animation:up .8s both}
.end .lg{font-weight:900;letter-spacing:4px;font-size:13px;opacity:.85}.end .lg b{color:var(--red)}
.end h1{margin:12px 0 0;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(34px,8vw,56px);line-height:1}
.end h1 em{display:block;font-style:italic;font-size:.42em;letter-spacing:3px;color:var(--gold);margin-top:8px}
.end .d{margin:14px 0 4px;font-size:15px;font-weight:700}
.end .st{font-size:13px;color:#f0c9a4}
.end .st i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff2d48;margin-right:6px;animation:bl 1.2s infinite}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btns a,.btns button{display:block;text-decoration:none;border:0;border-radius:12px;padding:13px 10px;font-weight:900;font-size:14px;cursor:pointer;font-family:inherit}
.btns .a1{background:var(--cream);color:var(--red)}
.btns .a2{background:linear-gradient(135deg,#c23a55,#7a1430);color:#fff}
.btns .rp{grid-column:1/-1;background:none;color:#fff;opacity:.7;text-decoration:underline;text-underline-offset:3px;padding:6px}
.btns small{display:block;font-size:10.5px;font-weight:700;opacity:.75;margin-top:2px}
/* loader */
.load{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
.load.hide{opacity:0;pointer-events:none}
.load .lg{font-weight:900;letter-spacing:5px}.load .lg b{color:var(--red)}
.load .pb{width:180px;height:3px;background:#222;border-radius:3px;overflow:hidden}.load .pb i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.load small{font-size:11.5px;opacity:.6;letter-spacing:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body class="bars">
<div class="stage" id="stage"></div>
<div class="bug"><i></i>JINGLE<b style="color:#b3243a">·</b>TV <small>SPECIAL TEASER</small></div>
<div class="rate" id="rate"></div>
<div class="prog" id="prog"></div>
<button class="skip" id="skip">건너뛰기 ›</button>
<div class="load" id="load"><div class="lg">JINGLE<b>·</b>TV</div><div class="pb"><i id="pbi"></i></div><small>방송 준비 중</small></div>

<script>
(function(){
'use strict';
var A='assets/';
var S1=[['sion','남시온',28,'건축설계사'],['yeonwoo','주연우',25,'광고 카피라이터'],['taegyeom','유태겸',29,'다큐멘터리 촬영감독'],['hangyeol','한결',23,'피아노 연주자'],['seoa','채서아',26,'플로리스트'],['dain','문다인',24,'피겨스케이팅 코치'],['haerin','신해린',28,'패션 매거진 에디터']];
var S2=[['mujin','차무진',31,'프라이빗 라운지 브랜드 대표'],['igeon','백이건',27,'DJ · 음악 프로듀서'],['jaeheon','류재헌',29,'프래그런스 크리에이티브 디렉터'],['yunjae','도윤재',28,'펜싱 코치'],['rahee','서라희',28,'광고 · 뷰티 모델'],['seon','진세온',25,'타투이스트'],['iseo','한이서',30,'아트 갤러리 디렉터']];
var stage=document.getElementById('stage'),rate=document.getElementById('rate'),prog=document.getElementById('prog');
function $(h){var d=document.createElement('div');d.className='scene';d.innerHTML=h;stage.innerHTML='';stage.appendChild(d);return d}
function fx(kind,n){var h='<div class="fx '+kind+'">';for(var i=0;i<n;i++){var sz=kind==='snow'?(2+Math.random()*5):(1.5+Math.random()*2.5);h+='<i style="left:'+(Math.random()*100)+'%;width:'+sz+'px;height:'+sz+'px;animation-duration:'+(6+Math.random()*8)+'s;animation-delay:-'+(Math.random()*12)+'s;opacity:'+(.4+Math.random()*.6)+'"></i>'}return h+'</div>'}
function bg(src,shade,cls){return '<div class="bg'+(cls?' '+cls:'')+'" style="background-image:url('+A+src+')"></div><div class="shade" style="background:'+shade+'"></div>'}
function setRate(r){rate.className='rate'+(r?' '+r:'');rate.textContent=r==='all'?'ALL':r==='r19'?'19':''}
function type(el,text,speed){var i=0;el.innerHTML='<span></span><i class="c"></i>';var s=el.firstChild;(function t(){if(i<=text.length){s.innerHTML=text.slice(0,i).replace(/\n/g,'<br>');i++;timers.push(setTimeout(t,speed))}})()}

var S1BG='linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.25) 55%,rgba(0,0,0,.7))';
var S2BG='linear-gradient(180deg,rgba(11,6,8,.25),rgba(40,6,18,.35) 55%,rgba(5,2,3,.85))';

function castCut(c,season){
  var col=season==='s1'?'#b3243a':'#d4af6a',img=season+'-'+c[0]+'-01.png';
  return function(){$( bg(img,season==='s1'?'rgba(30,10,10,.35)':'rgba(10,2,6,.55)','blur')+(season==='s1'?fx('snow',18):fx('gold',14))+
    '<div class="cut"><div class="card"><img src="'+A+img+'" alt="'+c[1]+'"></div><div class="l3"><div class="bar" style="background:'+col+'"></div><div class="t"><div class="n">'+c[1]+'<small>'+c[2]+'세</small></div><div class="j">'+c[3]+'</div></div></div></div><div class="flash"></div>')}
}

var T=[
 {d:2600,f:function(){setRate('');$('<div><div class="logo">JINGLE<b>·</b>TV</div><div class="kicker">SPECIAL TEASER</div></div>')}},
 {d:3200,f:function(){setRate('all');var s=$('<div class="shade" style="background:radial-gradient(circle at 50% 40%,#2a3a44,#0b1015)"></div>'+fx('snow',50)+'<div class="line" style="position:relative;z-index:6" id="ty"></div>');type(s.querySelector('#ty'),'올겨울,\n설산의 리조트에서',75)}},
 {d:3600,f:function(){$(bg('s1-group-1.png',S1BG)+fx('snow',40)+'<div class="cap"><span>“첫눈이 내리던 날, 낯선 사람들이 같은 집에 도착했다.”</span></div>')}},
 {d:3000,f:function(){$(bg('s1-group-2.png',S1BG)+fx('snow',40)+'<div class="cap"><span>[자막] 벽난로 앞, 아직 아무도 모르는 마음</span></div>')}}
].concat(S1.map(function(c){return{d:1150,f:castCut(c,'s1')}})).concat([
 {d:1500,f:function(){$(bg('place-house-02.png','rgba(0,0,0,.25)')+fx('snow',24)+'<div class="cap"><span>FIREPLACE LOUNGE</span></div>')}},
 {d:1500,f:function(){$(bg('place-resort-07.png','rgba(0,0,0,.2)')+fx('snow',30)+'<div class="cap"><span>TREE PLAZA</span></div>')}},
 {d:3600,f:function(){$('<div class="shade" style="background:radial-gradient(circle at 50% 45%,#fffaf2,#efe3d0 75%)"></div>'+fx('snow',46)+'<div class="tt s1"><div class="t1">MISTLETOE</div><div class="t2">SEASON 01 · 《미슬토우》</div><div class="t3">겨울, 사랑이 내리는 순간.</div><div class="b"><span>ALL 전체 이용가</span><span>11.24 FIRST SNOW</span></div></div>')}},
 {d:2800,f:function(){setRate('');var s=$('<div class="line" style="position:relative;z-index:6;color:#f0dcd2" id="ty"></div>');type(s.querySelector('#ty'),'그리고,\n밤이 오면',110)}},
 {d:3400,f:function(){setRate('r19');$(bg('s2-group-1.png',S2BG)+fx('gold',30)+'<div class="cap"><span>“같은 리조트, 다른 밤.”</span></div>')}},
 {d:3000,f:function(){$(bg('s2-group-2.png',S2BG)+fx('gold',30)+'<div class="cap"><span>[자막] 정규 일정이 끝난 뒤부터가 진짜</span></div>')}}
]).concat(S2.map(function(c){return{d:1150,f:castCut(c,'s2')}})).concat([
 {d:1500,f:function(){$(bg('place-house2-03.png','rgba(10,2,6,.3)')+fx('gold',20)+'<div class="cap"><span>VELVET BAR</span></div>')}},
 {d:1500,f:function(){$(bg('place-house2-01.png','rgba(10,2,6,.3)')+fx('gold',20)+'<div class="cap"><span>MIDNIGHT LOUNGE</span></div>')}},
 {d:3800,f:function(){$('<div class="shade" style="background:radial-gradient(circle at 50% 42%,#3a0d1c,#0b0608 72%)"></div>'+fx('gold',40)+'<div class="tt s2"><div class="t1">AFTER DARK</div><div class="t2">MISTLETOE · SEASON 02</div><div class="t3">겨울, 마음이 가장 뜨거워지는 밤.</div><div class="b"><span>19 청소년 관람불가</span><span>11.24 FIRST IMPRESSION</span></div></div>')}},
 {d:0,f:endCard}
]);

function airStatus(){var d=new Date(),y=d.getFullYear(),st=new Date(y,10,24),en=new Date(y,11,26);if(d<st)return '첫 방송 D-'+Math.ceil((st-d)/864e5);if(d<en)return 'EP.'+('0'+(Math.floor((d-st)/864e5)+1)).slice(-2)+' 지금 방송 중';return '전 회차 다시보기'}
function endCard(){
  setRate('');document.getElementById('skip').style.display='none';prog.style.width='100%';
  $(bg('s1-group-1.png','rgba(0,0,0,.55)')+'<div class="shade" style="background:linear-gradient(90deg,rgba(244,236,223,.18),rgba(11,6,8,.85))"></div>'+fx('snow',20)+fx('gold',16)+
   '<div class="end"><div class="lg">JINGLE<b>·</b>TV ORIGINAL</div><h1>《미슬토우》<em>MISTLETOE · AFTER DARK</em></h1><div class="d">11.24 — 12.25 · 크리스마스까지 매일 밤</div><div class="st"><i></i>'+airStatus()+'</div>'+
   '<div class="btns"><a class="a1" href="index.html#s1">시즌 1 보러 가기<small>MISTLETOE · 전체 이용가</small></a><a class="a2" href="index.html#s2">시즌 2 보러 가기<small>AFTER DARK · 19세 이상</small></a><button class="rp" id="replay">↻ 티저 다시 보기</button></div></div>');
  document.getElementById('replay').onclick=play;
}

var timers=[],total=T.reduce(function(s,x){return s+x.d},0);
function clear(){timers.forEach(clearTimeout);timers=[]}
function play(){
  clear();document.getElementById('skip').style.display='';var at=0;prog.style.transition='none';prog.style.width='0';
  T.forEach(function(s){timers.push(setTimeout(function(){s.f();prog.style.transition='width .25s linear';prog.style.width=(Math.min(at2(s),total)/total*100)+'%'},at));s._at=at;at+=s.d});
}
function at2(s){return s._at+s.d}
document.getElementById('skip').onclick=function(){clear();endCard()};

/* preload every image, then start */
var imgs=['s1-group-1.png','s1-group-2.png','s2-group-1.png','s2-group-2.png','place-house-02.png','place-resort-07.png','place-house2-03.png','place-house2-01.png'].concat(S1.map(function(c){return 's1-'+c[0]+'-01.png'}),S2.map(function(c){return 's2-'+c[0]+'-01.png'}));
var done=0,started=false,pbi=document.getElementById('pbi');
function start(){if(started)return;started=true;document.getElementById('load').classList.add('hide');play()}
imgs.forEach(function(s){var im=new Image();im.onload=im.onerror=function(){done++;pbi.style.width=(done/imgs.length*100)+'%';if(done===imgs.length)setTimeout(start,250)};im.src=A+s});
setTimeout(start,9000);
})();
</script>
</body>
</html>
